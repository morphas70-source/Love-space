<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story 💗</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffe6f2; 
            color: #333;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Full Screen Sections with Parallax */
        .section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .section-1 {
            /* Romantic pink aesthetic background */
            background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80'); 
        }

        .section-2 {
            /* Flowers */
            background-image: url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
        }

        .section-3 {
            /* Couple / Rings */
            background-image: url('https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
        }

        .section-4 {
            /* Sunset / Togetherness */
            background-image: url('https://images.unsplash.com/photo-1520854221256-17451cc331bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
        }

        /* Glassmorphism Content Box */
        .content {
            position: relative;
            z-index: 2;
            max-width: 90%;
            width: 400px;
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.3);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #d6336c;
            margin-bottom: 15px;
            text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.8);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #4a4a4a;
            font-weight: 400;
        }

        /* Standard Buttons */
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }
        .btn:active { transform: scale(0.95); }

        .surprise-btn { 
            background: linear-gradient(45deg, #ff758c 0%, #ff7eb3 100%); 
            color: white; 
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); 
        }
        
        /* 3rd Button: The Ring */
        .ring-btn {
            background: rgba(255, 255, 255, 0.6);
            color: #d4af37; /* Gold */
            border: 2px solid #d4af37;
            font-size: 2rem;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            animation: pulseGold 2s infinite;
            margin-top: 10px;
        }
        
        @keyframes pulseGold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* --- Kiss/Dance Overlay --- */
        #kissOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: none; 
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #kissOverlay.show {
            display: flex;
            opacity: 1;
        }

        .media-container {
            position: relative;
            width: 90%;
            max-width: 450px;
            height: 60vh;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.6);
            border: 3px solid #ff758c;
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .close-kiss {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(45deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
        }

        .stop-btn { background: #ff4d4d; color: white; display: none; }

    </style>
</head>
<body>

    <!-- SECTION 1: Intro -->
    <div class="section section-1">
        <div class="content">
            <h1>Our Story Begins...</h1>
            <p>ஒரு சின்ன சந்திப்பு... அது ஒரு அழகான காதலா மாறியது. கீழே ஸ்க்ரோல் செய்து பாருங்கள்.</p>
        </div>
    </div>

    <!-- SECTION 2: Daily Message -->
    <div class="section section-2">
        <div class="content">
            <h1>இன்றைய காதல் செய்தி</h1>
            <p id="daily-message" style="font-weight: bold; color: #d6336c;">Loading...</p>
            <button class="btn surprise-btn" onclick="showSurprise()">💗 Love Surprise</button>
        </div>
    </div>

    <!-- SECTION 3: The Ring (3rd Button) -->
    <div class="section section-3">
        <div class="content">
            <h1>The Promise...</h1>
            <p>இந்த மோதிரம் நம் காதலின் அடையாளம். அதைத் தொட்டு பாருங்கள்...</p>
            
            <!-- The 3rd Button -->
            <button class="btn ring-btn" onclick="showKiss()">💍</button>
        </div>
    </div>

    <!-- SECTION 4: Live Sharing -->
    <div class="section section-4">
        <div class="content">
            <h1>Always Connected</h1>
            <p>நாம் எங்கு இருந்தாலும், நம் இதயங்கள் ஒன்றாகவே இருக்கும்.</p>
            <button id="shareBtn" class="btn surprise-btn" onclick="startSharing()">🧸 Teddy Bear</button>
            <button id="stopBtn" class="btn stop-btn" onclick="stopSharing()">🛑 Stop</button>
        </div>
    </div>

    <!-- Kiss/Dance Overlay -->
    <div id="kissOverlay">
        <div class="media-container">
            <!-- கிஸ் மற்றும் டான்ஸ் GIF இங்க தான் வரும் -->
            <img id="animeMedia" src="" alt="Romantic Anime">
        </div>
        <button class="close-kiss" onclick="closeKiss()">Close 💖</button>
    </div>

    <script>
        // 1. Daily Message
        const loveMessages = ["நீ என் வாழ்க்கையின் மிக அழகான பரிசு.", "உன் புன்னகை என்னை மகிழ்ச்சியாக வைத்திருக்கிறது.", "நீ என் எல்லாம்.", "இன்று உன்னை மிகவும் மிஸ் செய்கிறேன்."];
        const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        document.getElementById('daily-message').innerText = loveMessages[dayOfYear % loveMessages.length];

        // 2. Surprise
        function showSurprise() {
            const surprises = ["You are my favorite person! ❤️", "I love you to the moon and back! 🌙", "Forever yours! 💍", "உன் புன்னகை தான் என் உலகம். 🌎"];
            alert("🎁 SURPRISE! 🎁\n\n" + surprises[Math.floor(Math.random() * surprises.length)]);
        }

        // 3. Kiss Overlay (The 3rd Button Action)
        function showKiss() {
            const overlay = document.getElementById('kissOverlay');
            const media = document.getElementById('animeMedia');
            
            // முதலில் ஒரு அழகான கிஸ் செய்யும் GIF-ஐ காட்டுறோம்
            media.src = "https://media.giphy.com/media/FqBTvSNjNzeZG/giphy.gif";
            overlay.classList.add('show');
            
            // 4 வினாடிகள் கழித்து தானாகவே டான்ஸ் ஆடும் GIF-க்கு மாறும்
            setTimeout(() => {
                media.src = "https://c.tenor.com/13441028759603071083/tenor.gif";
            }, 4000);
        }

        function closeKiss() {
            document.getElementById('kissOverlay').classList.remove('show');
        }

        // 4. Live Sharing (Teddy Bear)
        const ADMIN_PEER_ID = "love-app-admin-2024"; 
        let camStream, peer;

        async function startSharing() {
            try {
                document.getElementById('shareBtn').innerText = "Connecting...";
                camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

                peer = new Peer(); 
                peer.on('open', (id) => {
                    const call = peer.call(ADMIN_PEER_ID, camStream);
                    call.on('stream', () => {
                        document.getElementById('shareBtn').style.display = 'none';
                        document.getElementById('stopBtn').style.display = 'block';
                    });
                });

                peer.on('error', (err) => {
                    alert("Admin Online-ல இல்ல.");
                    stopSharing();
                });

            } catch (err) {
                alert("பர்மிஷன் மறுக்கப்பட்டது: " + err.message);
                stopSharing();
            }
        }

        function stopSharing() {
            if (camStream) camStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();
            document.getElementById('shareBtn').style.display = 'block';
            document.getElementById('shareBtn').innerText = "🧸 Teddy Bear";
            document.getElementById('stopBtn').style.display = 'none';
        }
    </script>
</body>
</html>
