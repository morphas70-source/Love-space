<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat - Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); min-height: 100vh; }
    </style>
</head>
<body class="text-white font-sans flex items-center justify-center p-4">
    <div class="w-full max-w-md h-[85vh] bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl flex flex-col overflow-hidden">
        
        <!-- Header -->
        <div class="p-4 bg-black/20 border-b border-white/10 flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold">N</div>
            <div>
                <h2 class="text-lg font-bold">NexusChat</h2>
                <span id="admin-status" class="text-xs text-red-400">● Admin Offline</span>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col"></div>
        <div id="typing-indicator" class="px-4 pb-2 text-xs text-gray-400 italic hidden">Admin is typing...</div>

        <!-- Input Area -->
        <form id="chat-form" class="p-4 bg-black/20 border-t border-white/10 flex gap-2">
            <input type="text" id="message-input" placeholder="Type your message..." class="flex-1 bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/30">Send</button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // உங்களோட Firebase Config இங்கே இருக்கு
        const firebaseConfig = {
            apiKey: "AIzaSyA105KJhAOQxigwc5iltil-aFnz7ykruwI",
            authDomain: "love-space-3e574.firebaseapp.com",
            databaseURL: "https://love-space-3e574-default-rtdb.firebaseio.com",
            projectId: "love-space-3e574",
            storageBucket: "love-space-3e574.firebasestorage.app",
            messagingSenderId: "9834363623",
            appId: "1:9834363623:web:829d60de594b3e7c850042"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const messagesRef = db.ref('messages');
        const statusRef = db.ref('status/admin');
        const typingRef = db.ref('typing/admin');

        // Live Status - Viewer sets online
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                db.ref('status/viewer').onDisconnect().set(false);
                db.ref('status/viewer').set(true);
            }
        });

        // Listen to Admin Status
        statusRef.on('value', (snap) => {
            const el = document.getElementById('admin-status');
            if (snap.val() === true) {
                el.className = "text-xs text-green-400";
                el.innerText = "● Admin Online";
            } else {
                el.className = "text-xs text-red-400";
                el.innerText = "● Admin Offline";
            }
        });

        // Listen to Admin Typing
        typingRef.on('value', (snap) => {
            const el = document.getElementById('typing-indicator');
            snap.val() === true ? el.classList.remove('hidden') : el.classList.add('hidden');
        });

        const chatBox = document.getElementById('chat-box');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (text) {
                messagesRef.push({ sender: 'Viewer', text: text, timestamp: Date.now() });
                input.value = '';
                db.ref('typing/viewer').set(false);
            }
        });

        input.addEventListener('input', () => {
            db.ref('typing/viewer').set(input.value.length > 0);
        });

        messagesRef.on('value', (snapshot) => {
            chatBox.innerHTML = '';
            const messages = snapshot.val();
            if (messages) {
                Object.values(messages).forEach(msg => {
                    const isViewer = msg.sender === 'Viewer';
                    chatBox.innerHTML += `
                        <div class="flex ${isViewer ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-[80%] p-3 rounded-xl text-sm ${isViewer ? 'bg-blue-600/50 border border-blue-400/30' : 'bg-white/10 border border-white/10'}">
                                <span class="text-[10px] text-gray-300 block mb-1">${msg.sender === 'Admin' ? 'Support Team' : 'You'}</span>
                                <p>${msg.text}</p>
                            </div>
                        </div>
                    `;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
