<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat - Customer Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); min-height: 100vh; }
    </style>
</head>
<body class="text-white font-sans flex items-center justify-center p-4">
    <div class="w-full max-w-md h-[85vh] bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl flex flex-col overflow-hidden">
        <!-- Header -->
        <div class="p-4 bg-black/20 border-b border-white/10 flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold">N</div>
            <div>
                <h2 class="text-lg font-bold">NexusChat Support</h2>
                <span class="text-xs text-green-400">● Online</span>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col">
            <!-- Messages will appear here -->
        </div>

        <!-- Input Area -->
        <form id="chat-form" class="p-4 bg-black/20 border-t border-white/10 flex gap-2">
            <input type="text" id="message-input" placeholder="Type your message..." class="flex-1 bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-blue-500" required>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/30">Send</button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ⚠️ இங்கேயும் அதே Firebase Config-ஐ பேஸ்ட் செய்யவும்
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const messagesRef = db.ref('messages');

        const chatBox = document.getElementById('chat-box');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');

        // மெசேஜ் அனுப்புதல்
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (text) {
                messagesRef.push({ sender: 'Viewer', text: text, timestamp: Date.now() });
                input.value = '';
            }
        });

        // மெசேஜ் பெறுதல்
        messagesRef.on('value', (snapshot) => {
            chatBox.innerHTML = '';
            const messages = snapshot.val();
            if (messages) {
                Object.values(messages).forEach(msg => {
                    const isViewer = msg.sender === 'Viewer';
                    const div = document.createElement('div');
                    div.className = `flex ${isViewer ? 'justify-end' : 'justify-start'}`;
                    div.innerHTML = `
                        <div class="max-w-[80%] p-3 rounded-xl text-sm ${isViewer ? 'bg-blue-600/50 border border-blue-400/30' : 'bg-white/10 border border-white/10'}">
                            <span class="text-[10px] text-gray-300 block mb-1">${msg.sender === 'Admin' ? 'Support Team' : 'You'}</span>
                            <p>${msg.text}</p>
                        </div>
                    `;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
